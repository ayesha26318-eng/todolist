<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: linear-gradient(purple);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      padding: 28px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h2 { color: #2d3748; font-size: 24px; }
    .date-text { font-size: 13px; color: #718096; margin-top: 3px; }

    .badge {
      background: #edf2f7;
      color: #5a67d8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    /* Input Area */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input[type="text"]:focus { border-color: #667eea; }

    .add-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .add-btn:hover { background: #5a67d8; }

    /* Filters */
    .filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .filter-btns button {
      background: none;
      border: none;
      color: #718096;
      font-size: 14px;
      margin-right: 10px;
      cursor: pointer;
      font-weight: 500;
    }

    .filter-btns button.active {
      color: #667eea;
      font-weight: 700;
      border-bottom: 2px solid #667eea;
      padding-bottom: 3px;
    }

    .clear-all {
      background: #fff5f5;
      color: #e53e3e;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Task List */
    ul { list-style: none; max-height: 300px; overflow-y: auto; }

    li {
      background: #f8fafc;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #edf2f7;
      transition: 0.2s;
    }

    li:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.04); }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 1;
    }

    .check-circle {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: white;
    }

    /* Jab kaam complete ho jaye */
    li.completed .check-circle {
      background: #48bb78;
      border-color: #48bb78;
    }

    li.completed span {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .del-btn {
      background: none;
      border: none;
      color: #cbd5e0;
      font-size: 18px;
      cursor: pointer;
      padding: 0 5px;
    }

    .del-btn:hover { color: #e53e3e; }

    .empty-msg {
      text-align: center;
      color: #a0aec0;
      padding: 30px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <div>
        <h2>My Tasks ✨</h2>
        <p class="date-text" id="todayDate"></p>
      </div>
      <span class="badge" id="taskCount">0 Baqi</span>
    </div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Aaj kya kaam karna hai?">
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <div class="filters">
      <div class="filter-btns">
        <button class="active" onclick="setFilter('all', this)">All</button>
        <button onclick="setFilter('pending', this)">Pending</button>
        <button onclick="setFilter('completed', this)">Completed</button>
      </div>
      <button class="clear-all" onclick="clearAll()">Clear All</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    // 1. Browser ki memory (localStorage) se purane saved tasks nikalna
    let tasks = JSON.parse(localStorage.getItem("myProTasks")) || [];
    let currentFilter = "all";

    // Aaj ki tareekh screen par dikhana
    document.getElementById("todayDate").innerText = new Date().toDateString();

    // Keyboard par 'Enter' dabane se task add ho
    document.getElementById("taskInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") addTask();
    });

    // 2. Data ko browser memory mein save karne ka function
    function saveToStorage() {
      localStorage.setItem("myProTasks", JSON.stringify(tasks));
    }

    // 3. Naya kaam add karna
    function addTask() {
      let input = document.getElementById("taskInput");
      let text = input.value.trim();

      if (text === "") return;

      // Har task ek Object ban kar Array mein save hoga
      tasks.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = "";
      saveToStorage();
      renderTasks();
    }

    // 4. Kaam ko complete / incomplete mark karna
    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          return { ...task, completed: !task.completed };
        }
        return task;
      });
      saveToStorage();
      renderTasks();
    }

    // 5. Kisi ek kaam ko delete karna
    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveToStorage();
      renderTasks();
    }

    // 6. Saare kaam ek saath saaf karna
    function clearAll() {
      tasks = [];
      saveToStorage();
      renderTasks();
    }

    // 7. Filter tabdeel karna (All / Pending / Completed)
    function setFilter(filterType, btn) {
      currentFilter = filterType;
      document.querySelectorAll(".filter-btns button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderTasks();
    }

    // 8. Screen par saari list dobara banana (Render)
    function renderTasks() {
      let list = document.getElementById("taskList");
      list.innerHTML = "";

      // Baqi kaam gin'na
      let pendingCount = tasks.filter(t => !t.completed).length;
      document.getElementById("taskCount").innerText = pendingCount + " Baqi";

      // Filter ke mutabiq tasks channa
      let filteredTasks = tasks.filter(task => {
        if (currentFilter === "pending") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        list.innerHTML = '<div class="empty-msg">Koi kaam maujood nahi hai 🎉</div>';
        return;
      }

      filteredTasks.forEach(task => {
        let li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        li.innerHTML = `
          <div class="task-left" onclick="toggleTask(${task.id})">
            <div class="check-circle">${task.completed ? "✓" : ""}</div>
            <span>${task.text}</span>
          </div>
          <button class="del-btn" onclick="deleteTask(${task.id})">×</button>
        `;
        list.appendChild(li);
      });
    }

    // Page khulte hi pehli baar list dikhana
    renderTasks();
  </script>

</body>
</html>
